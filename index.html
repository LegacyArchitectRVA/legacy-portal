<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      STORAGE RESILIENCE SHIM
      Runs before Convex, React, or any app code. Some mobile browser privacy
      modes (Brave Shields, Chrome's stricter mobile storage rules) block
      localStorage, sessionStorage, and IndexedDB outright. Chrome's error for
      this is "SecurityError: The request was denied." Several things in this
      app touch storage without expecting that: Convex Auth's default token
      storage, and tesseract.js's OCR language-data cache (used in
      documentConverter.ts) both assume storage always works.

      Instead of patching every library one at a time, this replaces
      localStorage/sessionStorage with a working in-memory fallback the
      moment real storage proves blocked, and wraps indexedDB.open so a
      blocked database fails the normal async way (onerror) instead of
      throwing synchronously and skipping past a library's own error
      handling. Nothing here is destructive: if storage works normally, this
      does nothing and the real APIs are left alone.
    -->
    <script>
      (function () {
        function makeMemoryStorage() {
          var map = new Map();
          return {
            getItem: function (k) {
              return map.has(k) ? map.get(k) : null;
            },
            setItem: function (k, v) {
              map.set(String(k), String(v));
            },
            removeItem: function (k) {
              map.delete(k);
            },
            clear: function () {
              map.clear();
            },
            key: function (i) {
              return Array.from(map.keys())[i] ?? null;
            },
            get length() {
              return map.size;
            },
          };
        }

        function shimWebStorage(propName) {
          try {
            var real = window[propName];
            var testKey = "__lrva_storage_probe__";
            real.setItem(testKey, "1");
            real.removeItem(testKey);
            // Works fine here, leave the real implementation alone.
          } catch (e) {
            // Blocked. Swap in one shared in-memory instance so everything
            // reading window[propName] sees the same data for this page load.
            var memoryInstance = makeMemoryStorage();
            try {
              Object.defineProperty(window, propName, {
                configurable: true,
                get: function () {
                  return memoryInstance;
                },
              });
            } catch (e2) {
              // If the property itself can't be redefined, there's nothing
              // more to do here; the diagnostic catcher below will still
              // surface whatever throws downstream.
            }
          }
        }

        shimWebStorage("localStorage");
        shimWebStorage("sessionStorage");

        try {
          if (window.indexedDB && window.indexedDB.open) {
            var nativeOpen = window.indexedDB.open.bind(window.indexedDB);
            window.indexedDB.open = function () {
              try {
                return nativeOpen.apply(window.indexedDB, arguments);
              } catch (err) {
                // Mimic a normal failed IDB request: return a request-shaped
                // object and fire onerror asynchronously, same as a real
                // blocked-database failure would, instead of throwing here
                // and skipping past the caller's own error handling.
                var fakeRequest = {};
                setTimeout(function () {
                  if (typeof fakeRequest.onerror === "function") {
                    fakeRequest.onerror({ target: { error: err } });
                  }
                }, 0);
                return fakeRequest;
              }
            };
          }
        } catch (e) {
          // Best effort only.
        }
      })();
    </script>

    <!--
      DIAGNOSTIC — safety net for anything not covered above. Catches any
      remaining script error or unhandled promise rejection and writes it
      straight onto the page as plain text, visible on a phone with no
      devtools needed. Remove once the portal's been stable for a while.

      One thing this has to be careful about: the window "error" listener
      below is capture-phase, which is needed to catch the app's own script
      tag failing to load (a 404 or CSP block on /src/main.tsx would be
      fatal, the whole app can't boot). But capture-phase also sees every
      OTHER resource load failure on the page: a broken <img>, a blocked
      stylesheet, and so on. Those aren't crashes, several places in the app
      (like the profile photo and crest previews) already handle a broken
      image gracefully on their own. A plain resource load failure fires as
      an ordinary Event with no message, filename, or error attached, that's
      the "Unknown error at ?:?" text, not a real problem. Only a genuine
      ErrorEvent (an actual thrown script error) or the main script tag
      itself failing to load should take over the screen.
    -->
    <script>
      (function () {
        function showDiagnostic(title, detail) {
          if (document.getElementById("__lrva_diag__")) return;
          var el = document.createElement("div");
          el.id = "__lrva_diag__";
          el.style.cssText =
            "position:fixed;inset:0;z-index:999999;background:#0f0c08;" +
            "color:#f2ede2;font-family:monospace;font-size:13px;" +
            "padding:16px;overflow:auto;white-space:pre-wrap;line-height:1.5;";
          el.textContent = title + "\n\n" + detail;
          document.body ? document.body.appendChild(el) : document.addEventListener("DOMContentLoaded", function () {
            document.body.appendChild(el);
          });
        }
        window.addEventListener(
          "error",
          function (e) {
            var isRealScriptError = e instanceof ErrorEvent;
            var isMainScriptLoadFailure =
              !isRealScriptError &&
              e.target &&
              e.target.tagName === "SCRIPT";

            // A resource (image, stylesheet, etc.) other than the app's own
            // script tag failing to load isn't fatal, the page carries on.
            // Don't paint over a portal that's actually working fine.
            if (!isRealScriptError && !isMainScriptLoadFailure) return;

            var detail;
            if (isRealScriptError) {
              detail =
                e.error && e.error.stack
                  ? e.error.stack
                  : (e.message || "Unknown error") +
                    " at " +
                    (e.filename || "?") +
                    ":" +
                    (e.lineno || "?");
            } else {
              detail =
                "The app's main script tag failed to load: " +
                (e.target.src || e.target.outerHTML);
            }
            showDiagnostic("Caught a script error:", detail);
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var reason = e.reason;
          var detail =
            reason && reason.stack ? reason.stack : String(reason);
          showDiagnostic("Caught an unhandled promise rejection:", detail);
        });
      })();
    </script>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Cardo:wght@400;700&family=Cinzel:wght@400;500;600;700;800&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Legacy Architect RVA | Client Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script data-cfasync="false" type="module" src="/src/main.tsx"></script>
  </body>
</html>
